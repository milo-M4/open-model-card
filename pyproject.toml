[project]
name = "open-model-card"
version = "0.4.0"
description = "Repeatable local report card for OpenAI-compatible model endpoints."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "milo-M4" }]
keywords = ["llm", "benchmark", "llama.cpp", "local-ai"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.scripts]
open-model-card = "open_model_card.cli:main"

[project.urls]
Homepage = "https://github.com/milo-M4/open-model-card"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
